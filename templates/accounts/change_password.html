{% extends 'base.html' %}
{% block title %}Change Password — ShopAI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="fw-bold mb-4"><i class="bi bi-lock text-primary me-2"></i>Change Password</h3>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary w-100 mt-2">
            <i class="bi bi-check-lg me-2"></i>Change Password
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
